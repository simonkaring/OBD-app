name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The macos-15 image ships the iPhone 16 family (iOS 18); AGENTS.md documents
  # iPhone 17 because a local Xcode with the newest runtime has it. Change this one
  # value when the runner image gains a newer simulator.
  SIMULATOR: iPhone 16

jobs:
  engine:
    name: Engine tests and knowledge bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Swift version
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: OKF conformance and drift
        run: swift run VoltLinkCLI okf check
      - name: swift-format
        run: swift format lint --strict --recursive --configuration .swift-format Package.swift App CarPlay Core Data Services UI Widgets Tests UITests Tools

  ios:
    name: iOS simulator build and UI smoke test
    runs-on: macos-15
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Regenerate Xcode project
        run: python3 scratch/make_xcodeproj.py
      - name: Build
        run: |
          xcodebuild -scheme VoltLink \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            CODE_SIGNING_ALLOWED=NO build
      - name: UI smoke test
        run: |
          xcodebuild test -scheme VoltLink \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -only-testing:VoltLinkUITests \
            CODE_SIGNING_ALLOWED=NO
